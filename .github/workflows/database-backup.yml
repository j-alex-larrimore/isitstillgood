name: Database Backup to Backblaze B2

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client and rclone
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release

          # Add the official PostgreSQL apt repository (has v18; Ubuntu's default only has v16)
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          CODENAME=$(lsb_release -cs)
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update

          # Remove any pre-installed older client so it can't shadow v18 on PATH
          sudo apt-get remove -y postgresql-client-common postgresql-client-16 || true
          sudo apt-get install -y postgresql-client-18

          curl -fsSL https://rclone.org/install.sh | sudo bash

          # Verify: the v18 binary must exist, or fail the job now
          if [ ! -x /usr/lib/postgresql/18/bin/pg_dump ]; then
            echo "ERROR: PostgreSQL 18 client did not install correctly"
            ls -la /usr/lib/postgresql/ || true
            exit 1
          fi
          echo "Installed: $(/usr/lib/postgresql/18/bin/pg_dump --version)"

      - name: Create compressed database dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          set -e
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_PUBLIC_URL secret is empty or not set"
            exit 1
          fi

          # Use the full path to the v18 binary — do NOT rely on PATH
          PGDUMP=/usr/lib/postgresql/18/bin/pg_dump
          echo "Using: $($PGDUMP --version)"

          STAMP=$(date +%Y-%m-%d_%H%M%S)
          DUMP="backup_${STAMP}.sql.gz"

          set -o pipefail
          "$PGDUMP" "$DATABASE_URL" --no-owner --no-privileges | gzip > "$DUMP"

          SIZE=$(stat -c%s "$DUMP")
          echo "Dump size: ${SIZE} bytes"
          if [ "$SIZE" -lt 1000 ]; then
            echo "ERROR: dump is only ${SIZE} bytes — pg_dump likely failed. Contents:"
            gunzip -c "$DUMP" || true
            exit 1
          fi

          echo "DUMP_FILE=${DUMP}" >> "$GITHUB_ENV"
          echo "Created ${DUMP} ($(du -h "$DUMP" | cut -f1))"

      - name: Configure rclone for Backblaze B2
        env:
          B2_KEY_ID:  ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          set -e
          if [ -z "$B2_KEY_ID" ] || [ -z "$B2_APP_KEY" ]; then
            echo "ERROR: B2_KEY_ID or B2_APP_KEY secret is empty or not set"
            exit 1
          fi
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [b2]
          type = b2
          account = ${B2_KEY_ID}
          key = ${B2_APP_KEY}
          EOF

      - name: Upload dump to B2
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          set -e
          if [ -z "$B2_BUCKET" ]; then
            echo "ERROR: B2_BUCKET secret is empty or not set"
            exit 1
          fi
          rclone copy "$DUMP_FILE" "b2:${B2_BUCKET}/daily/" --progress
          echo "Verifying upload..."
          rclone ls "b2:${B2_BUCKET}/daily/" | tail -5

      - name: Prune B2 backups older than 30 days
        env:
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          rclone delete "b2:${B2_BUCKET}/daily/" --min-age 30d || true
          echo "Prune complete"
