name: Sync New Releases

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync new movies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/sync-new-releases.js

      - name: Sync new TV shows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/sync-new-tv.js

      # Full-catalog sweep (~9,700+ shows, one TMDB call each) — checks for
      # new seasons of shows already in the DB, which the "new TV shows"
      # step above can't see (it only catches brand-new premieres). Slower
      # than the other two steps; GitHub Actions' default 6-hour job timeout
      # gives plenty of headroom.
      - name: Sync new seasons of existing shows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/sync-new-seasons.js

      # Full-catalog sweep (~27,000+ movies/shows, one TMDB call each) —
      # refreshes streaming/rent/buy availability (JustWatch via TMDB).
      # Same reasoning as "Sync new seasons" above: no "what changed"
      # endpoint to narrow this to, so every run re-checks everything.
      - name: Sync streaming providers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/sync-streaming-providers.js

      - name: Sync new books
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: node scripts/sync-new-books.js

      - name: Sync new video games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: node scripts/sync-new-games.js

      # Deliberately last. Every step above adds titles, and the first thing
      # this one does for each waiting rating is look in the catalogue again —
      # so anything the sync just brought in resolves here for free, with no
      # provider call at all. Running it first would send those same rows out
      # to TMDB and Google Books to be told what we had just finished storing.
      #
      # Readers' own ratings, so a failure here should not fail the catalogue
      # sync that already succeeded.
      - name: Resolve pending imports
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: node scripts/resolve-pending-imports.js --limit 300
